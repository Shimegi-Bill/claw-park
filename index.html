<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140c22">
<title>夾公仔樂園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chiron+GoRound+TC:wght@400;700;900&family=Chiron+Hei+HK:wght@400;600;800&display=swap">
<style>
/* 版面：機舖夜景。大廳 = 一列機台卡；遊戲 = 上欄 / 3D 畫面 / 下面投幣同按鈕 */
:root {
  --night: #140c22;
  --panel: #22163a;
  --panel-2: #2e1f4b;
  --line: #4a3670;
  --ink: #fff4fb;
  --muted: #b8a7d8;
  --pink: #ff4f8b;
  --gold: #ffc531;
  --gold-deep: #c98a00;
  --cyan: #3fd0ff;
  --mint: #52e3c2;
  --danger: #ff6b6b;
  --display: "Chiron GoRound TC", "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  --body: "Chiron Hei HK", "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  --num: "Bungee", "Chiron GoRound TC", system-ui, sans-serif;
  --r: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.5;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-family: var(--num); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }

/* ---------- 載入 ---------- */
#boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: radial-gradient(120% 80% at 50% 20%, #34205a 0%, var(--night) 70%); text-align: center; padding: 24px 16px; }
#boot h1 { font-family: var(--display); font-weight: 900; font-size: clamp(38px, 11vw, 64px); margin: 0 0 6px; letter-spacing: 0.04em; text-wrap: balance; }
#boot h1 span { color: var(--pink); }
#boot p { color: var(--muted); margin: 0; }
.spinner { width: 54px; height: 54px; margin: 22px auto 12px; border-radius: 50%; border: 6px solid var(--panel-2); border-top-color: var(--gold); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#boot .err { color: var(--danger); max-width: 34ch; margin-top: 12px; }

/* ---------- 大廳 ---------- */
#lobby { min-height: 100%; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px); max-width: 980px; margin: 0 auto; }
.topline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 900; font-size: 26px; letter-spacing: 0.05em; margin-right: auto; display: flex; align-items: center; gap: 10px; }
.brand .bulb { width: 34px; height: 34px; border-radius: 10px; background: var(--pink); display: grid; place-items: center; box-shadow: 0 0 18px #ff4f8b88; }
.brand small { font-family: var(--num); font-size: 12px; color: var(--gold); letter-spacing: 0.1em; display: block; line-height: 1; margin-top: 2px; }
.wallet { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 4px 14px 4px 5px; font-size: 18px; }
.coin-ico { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, var(--gold) 45%, var(--gold-deep)); box-shadow: inset 0 -2px 0 #0003, 0 0 0 2px #ffe08a inset; display: grid; place-items: center; color: #7a4d00; font: 900 12px var(--num); }
.chip-btn { background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 7px 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.chip-btn:hover { border-color: var(--muted); }
.chip-btn.hot { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 14px #ffc53155; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 2px #ffc53122; } }

.marquee { margin: 18px 0 16px; padding: 14px 16px; border-radius: var(--r); background: linear-gradient(100deg, #2b1a49, #3a1f4e 55%, #2b1a49); border: 2px solid var(--line); display: flex; gap: 14px; align-items: center; }
.marquee b { font-family: var(--display); font-size: 17px; }
.marquee p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.marquee .lights { display: flex; gap: 6px; }
.marquee .lights i { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); animation: blink 1.2s infinite; }
.marquee .lights i:nth-child(2) { animation-delay: 0.4s; background: var(--pink); }
.marquee .lights i:nth-child(3) { animation-delay: 0.8s; background: var(--cyan); }
@keyframes blink { 50% { opacity: 0.25; } }

.machines { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 14px; }
.mcard { position: relative; display: grid; grid-template-columns: 104px 1fr; gap: 14px; padding: 12px; border-radius: var(--r); background: var(--panel); border: 2px solid var(--line); text-align: left; transition: transform 0.15s, border-color 0.15s; }
.mcard:hover { transform: translateY(-2px); border-color: var(--c); }
.mcard .cab { border-radius: 14px; background: linear-gradient(180deg, var(--c) 0 20%, color-mix(in srgb, var(--c) 30%, #fff) 20% 100%); position: relative; overflow: hidden; min-height: 132px; box-shadow: inset 0 0 0 3px #ffffff33; }
.mcard .cab svg { position: absolute; inset: 22% 8% 6%; width: 84%; height: 72%; }
.mcard .cab .nm { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font: 900 11px var(--display); color: #fff; letter-spacing: 0.08em; }
.mcard h3 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag { font: 700 11px var(--body); padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 25%, transparent); color: color-mix(in srgb, var(--c) 60%, #fff); letter-spacing: 0.06em; }
.mcard p { margin: 4px 0 8px; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.price { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; color: var(--gold); }
.price .coin-ico { width: 18px; height: 18px; font-size: 9px; }
.diff { color: var(--muted); letter-spacing: 1px; }
.diff b { color: var(--pink); font-weight: 400; }
.stat { color: var(--muted); }
.play-btn { margin-top: 10px; width: 100%; padding: 10px; border: 0; border-radius: 12px; background: var(--c); color: #fff; font: 900 16px var(--display); letter-spacing: 0.1em; box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 55%, #000); }
.play-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 55%, #000); }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 20px; text-align: center; }

/* ---------- 遊戲 ---------- */
#game { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--night); }
.hud-top { padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; display: flex; align-items: center; gap: 8px; background: linear-gradient(180deg, #140c22, #140c22ee); z-index: 3; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.hud-title { font: 900 17px var(--display); margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px; border-radius: 999px; background: var(--panel); border: 2px solid var(--line); font-size: 15px; flex: none; }
.pill .coin-ico { width: 22px; height: 22px; font-size: 10px; }
.pill.credit { padding: 4px 10px; }
.pill.credit b { color: var(--mint); }

.stage { position: relative; flex: 1; min-height: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.overlay-tl { position: absolute; left: 10px; top: 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; pointer-events: none; }
.overlay-tr { position: absolute; right: 10px; top: 8px; display: flex; gap: 4px; background: #140c22cc; padding: 4px; border-radius: 12px; border: 1px solid var(--line); }
.overlay-tr button { border: 0; background: transparent; padding: 5px 9px; border-radius: 8px; font-size: 13px; color: var(--muted); font-weight: 700; }
.overlay-tr button.on { background: var(--panel-2); color: var(--ink); }
.gripchip { background: #140c22cc; border: 1px solid var(--line); border-radius: 10px; padding: 4px 9px; font-size: 12px; color: var(--muted); }
.gripchip b { color: var(--ink); }
.gripchip.payout { border-color: var(--gold); color: var(--gold); }
.timer { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); font: 400 30px var(--num); color: var(--gold); text-shadow: 0 2px 0 #0008; pointer-events: none; }
.timer.low { color: var(--danger); }
.toast { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); pointer-events: none; text-align: center; font: 900 clamp(28px, 9vw, 46px) var(--display); color: #fff; text-shadow: 0 3px 0 var(--pink), 0 0 24px #ff4f8b99; white-space: nowrap; }
.toast small { display: block; font: 700 15px var(--body); text-shadow: none; color: var(--ink); background: #140c22cc; border-radius: 999px; padding: 3px 12px; margin-top: 6px; }
.toast.show { animation: pop 1.6s ease forwards; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 20% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%); } }
.settle { position: absolute; inset: auto 0 14px; text-align: center; color: var(--ink); font-weight: 700; pointer-events: none; }
.settle span { background: #140c22cc; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); }

.hud-bottom { padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 12px); background: linear-gradient(180deg, #1d1232, #140c22); border-top: 2px solid var(--line); display: grid; gap: 10px; z-index: 3; }
.tray { display: flex; align-items: center; gap: 10px; }
.stack { position: relative; width: 62px; height: 52px; flex: none; touch-action: none; cursor: grab; border: 0; background: none; padding: 0; }
.stack .c { position: absolute; left: 6px; width: 50px; height: 18px; border-radius: 50%; background: radial-gradient(ellipse at 40% 35%, #fff3b0, var(--gold) 50%, var(--gold-deep)); box-shadow: 0 3px 0 #9a6a00; }
.stack .c:nth-child(1) { bottom: 0; } .stack .c:nth-child(2) { bottom: 7px; } .stack .c:nth-child(3) { bottom: 14px; } .stack .c:nth-child(4) { bottom: 21px; }
.stack.empty .c { filter: grayscale(1) brightness(0.5); }
.tray-hint { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); line-height: 1.35; }
.tray-hint b { color: var(--ink); }
.tray-hint .arrow { display: inline-block; animation: nudge 1s ease-in-out infinite; color: var(--gold); }
@keyframes nudge { 50% { transform: translateX(5px); } }
.slot { width: 64px; height: 64px; flex: none; border-radius: 16px; background: linear-gradient(180deg, #d9e1ea, #9aa6b4); display: grid; place-items: center; box-shadow: inset 0 2px 0 #fff8, 0 3px 0 #5c6673; position: relative; }
.slot::before { content: ""; width: 9px; height: 34px; border-radius: 5px; background: #1b1626; box-shadow: inset 0 2px 3px #000; }
.slot::after { content: "投幣"; position: absolute; bottom: -2px; font: 800 10px var(--body); color: #33384a; }
.slot.hover { box-shadow: 0 0 0 4px var(--gold), 0 0 22px var(--gold); }
.slot.need { animation: slotglow 1.4s ease-in-out infinite; }
@keyframes slotglow { 50% { box-shadow: 0 0 0 3px #ffc53199, 0 0 16px #ffc53188; } }
.paid { display: flex; gap: 4px; justify-content: center; margin-top: 2px; }
.flycoin { position: fixed; width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, var(--gold) 45%, var(--gold-deep)); box-shadow: inset 0 0 0 3px #ffe08a, 0 4px 10px #0008; z-index: 40; pointer-events: none; display: grid; place-items: center; font: 400 15px var(--num); color: #7a4d00; transform: translate(-50%, -50%); }
.flycoin.in { transition: all 0.28s ease-in; }

.controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 104px; }
.abtn { --c: var(--pink); width: 96px; height: 96px; border-radius: 50%; border: 0; flex: none; position: relative; touch-action: none;
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--c) 55%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000));
  box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 45%, #000), 0 0 0 5px #0006, 0 0 0 7px color-mix(in srgb, var(--c) 40%, #222);
  color: #fff; font: 900 15px var(--display); line-height: 1.15; text-shadow: 0 1px 0 #0006; display: grid; place-items: center; }
.abtn .big { font: 400 28px var(--num); display: block; }
.abtn.pressed, .abtn:active { transform: translateY(5px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 45%, #000), 0 0 0 5px #0006, 0 0 0 7px color-mix(in srgb, var(--c) 40%, #222); }
.abtn:disabled { filter: grayscale(0.85) brightness(0.55); }
.abtn.live { animation: live 0.9s ease-in-out infinite; }
@keyframes live { 50% { box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 45%, #000), 0 0 0 5px #0006, 0 0 0 7px color-mix(in srgb, var(--c) 40%, #222), 0 0 26px 6px color-mix(in srgb, var(--c) 70%, transparent); } }
.abtn.b1 { --c: #3fa9ff; } .abtn.b2 { --c: #ffb020; } .abtn.drop { --c: var(--pink); width: 108px; height: 108px; } .abtn.grab { --c: var(--mint); }
.ctrl-mid { flex: 1; min-width: 0; text-align: center; font-size: 13px; color: var(--muted); line-height: 1.4; }
.ctrl-mid b { color: var(--ink); }
.joy { width: 118px; height: 118px; border-radius: 50%; background: radial-gradient(circle, #2e1f4b 0 55%, #22163a 56%); border: 3px solid var(--line); position: relative; touch-action: none; flex: none; }
.joy::before, .joy::after { content: ""; position: absolute; left: 50%; top: 50%; background: #ffffff22; transform: translate(-50%, -50%); }
.joy::before { width: 70%; height: 4px; } .joy::after { width: 4px; height: 70%; }
.knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ff8fb2, var(--pink) 55%, #b02a5b); box-shadow: 0 5px 0 #7d1d41, 0 6px 12px #0008; z-index: 1; }
.joy.dim { opacity: 0.45; }

/* ---------- 彈出視窗 ---------- */
.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: #0a0612cc; backdrop-filter: blur(4px); }
.sheet { width: min(100%, 520px); max-height: calc(100% - 20px); overflow: auto; background: var(--panel); border: 2px solid var(--line); border-radius: 22px; padding: 18px 16px 18px; }
.sheet h2 { margin: 0 0 4px; font: 900 22px var(--display); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet h3 { margin: 18px 0 8px; font: 800 14px var(--body); color: var(--gold); letter-spacing: 0.08em; }
.sheet .sub { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
.x { width: 36px; height: 36px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel-2); font-size: 18px; line-height: 1; flex: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid #ffffff12; }
.row label { font-weight: 700; }
.row .hint { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.row output { font: 400 14px var(--num); color: var(--gold); min-width: 52px; text-align: right; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--pink); height: 26px; }
.seg { display: inline-flex; background: var(--night); border-radius: 12px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; color: var(--muted); font-weight: 700; font-size: 13.5px; }
.seg button.on { background: var(--pink); color: #fff; }
.toggle { width: 52px; height: 30px; border-radius: 999px; border: 0; background: var(--panel-2); position: relative; box-shadow: inset 0 0 0 2px var(--line); }
.toggle::after { content: ""; position: absolute; left: 4px; top: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform 0.15s; }
.toggle.on { background: var(--mint); box-shadow: none; }
.toggle.on::after { transform: translateX(22px); background: #fff; }
.btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.btn { flex: 1; min-width: 130px; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel-2); font-weight: 800; }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #3a2400; }
.btn:disabled { opacity: 0.45; }

.win-card { text-align: center; }
.win-card canvas, .win-card img { width: 170px; height: 170px; border-radius: 28px; background: radial-gradient(circle, #ffffff 0 40%, #ffe3ef 75%); margin: 6px auto 8px; display: block; box-shadow: 0 0 0 4px var(--gold), 0 0 40px #ffc53166; }
.win-card .big { font: 900 30px var(--display); color: var(--gold); margin: 0; letter-spacing: 0.06em; }
.win-card .nm { font: 900 22px var(--display); margin: 2px 0; }
.stars { color: var(--gold); letter-spacing: 3px; }
.stars i { color: #ffffff30; font-style: normal; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 35; width: 100%; height: 100%; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.tabs button { border: 2px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 13px; color: var(--muted); }
.tabs button.on { border-color: var(--pink); color: var(--ink); }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.dex .it { background: var(--panel-2); border-radius: 14px; padding: 8px 6px; text-align: center; border: 2px solid transparent; }
.dex .it.got { border-color: #ffffff1a; }
.dex .it img { width: 64px; height: 64px; display: block; margin: 0 auto 2px; }
.dex .it.no img { filter: brightness(0) opacity(0.35); }
.dex .it .n { font-size: 12px; font-weight: 700; line-height: 1.25; min-height: 2.5em; }
.dex .it .c { font: 400 11px var(--num); color: var(--gold); }
.progress { height: 10px; background: var(--night); border-radius: 999px; overflow: hidden; margin-top: 6px; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--gold)); }
.howto { margin: 0; padding-left: 1.2em; color: var(--muted); font-size: 13.5px; }
.howto li { margin: 3px 0; }
.howto b { color: var(--ink); }

@media (min-width: 760px) and (min-height: 561px) {
  .controls { justify-content: center; gap: 40px; }
  .hud-bottom { grid-template-columns: minmax(0, 380px) minmax(0, 1fr); align-items: center; }
}
/* 手機打橫：控制區擺右邊 */
@media (orientation: landscape) and (max-height: 560px) {
  #game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 36%); grid-template-rows: auto minmax(0, 1fr); }
  .hud-top { grid-column: 1 / -1; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .stage { grid-column: 1; grid-row: 2; }
  .hud-bottom { grid-column: 2; grid-row: 2; border-top: 0; border-left: 2px solid var(--line); align-content: center; padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  .controls { min-height: 0; gap: 8px; }
  .ctrl-mid { font-size: 12px; }
  .abtn { width: 80px; height: 80px; font-size: 13px; } .abtn.drop { width: 88px; height: 88px; } .abtn .big { font-size: 22px; }
  .joy { width: 100px; height: 100px; } .knob { width: 46px; height: 46px; margin: -23px 0 0 -23px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>

<body>
<div id="boot">
  <div>
    <h1>夾公仔<span>樂園</span></h1>
    <p>3D 真實物理夾公仔機</p>
    <div class="spinner"></div>
    <p id="bootMsg">載入物理引擎中…</p>
    <p class="err" id="bootErr" hidden></p>
  </div>
</div>

<main id="lobby" hidden>
  <div class="topline">
    <div class="brand"><div class="bulb"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v6M7 8h10M9 8c-3 3-3 7-1 10M15 8c3 3 3 7 1 10"/></svg></div><div>夾公仔樂園<small>CLAW PARK 3D</small></div></div>
    <span class="wallet"><span class="coin-ico">¢</span><b class="num" id="lobbyCoins">0</b></span>
    <button class="chip-btn" id="dailyBtn">每日金幣</button>
    <button class="chip-btn" id="dexBtn">圖鑑</button>
    <button class="chip-btn" id="setBtn">設定</button>
  </div>
  <div class="marquee">
    <div class="lights"><i></i><i></i><i></i></div>
    <div><b>揀一部機開始玩</b><p>入幣先開機。每部機嘅爪力、二段收爪同保底都可以喺入面「設定」調校。</p></div>
  </div>
  <section class="machines" id="machineList"></section>
  <p class="foot">遊戲紀錄只會存喺呢部裝置嘅瀏覽器。</p>
</main>

<section id="game" hidden>
  <header class="hud-top">
    <button class="icon-btn" id="backBtn" aria-label="返大廳"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="hud-title" id="hudTitle">三爪公仔機</div>
    <span class="pill"><span class="coin-ico">¢</span><b class="num" id="hudCoins">0</b></span>
    <span class="pill credit">局 <b class="num" id="hudCredits">0</b></span>
    <button class="icon-btn" id="gSetBtn" aria-label="爪力設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/></svg></button>
  </header>
  <div class="stage">
    <canvas id="view"></canvas>
    <div class="overlay-tl">
      <div class="gripchip" id="gripChip">爪力 <b>85%</b> → <b>35%</b></div>
      <div class="gripchip" id="payoutChip" hidden></div>
    </div>
    <div class="overlay-tr" role="group" aria-label="鏡頭">
      <button data-view="front" class="on">正面</button>
      <button data-view="side">側面</button>
      <button data-view="corner">斜角</button>
    </div>
    <div class="timer num" id="timer" hidden>20</div>
    <div class="toast" id="toast"></div>
    <div class="settle" id="settleMsg" hidden><span>擺貨中…</span></div>
  </div>
  <footer class="hud-bottom">
    <div class="tray">
      <button class="stack" id="coinStack" aria-label="金幣（拖入投幣口）"><span class="c"></span><span class="c"></span><span class="c"></span><span class="c"></span></button>
      <div class="tray-hint" id="trayHint">將金幣<b>拖入投幣口</b> <span class="arrow">→</span></div>
      <div><div class="slot" id="coinSlot"></div><div class="paid" id="paidDots"></div></div>
    </div>
    <div class="controls" id="controls"></div>
  </footer>
</section>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<canvas id="confetti" hidden></canvas>

<script type="module" src="./js/main.js"></script>
</body>
</html>
